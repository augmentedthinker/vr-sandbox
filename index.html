<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>VR Studio Sandbox | Artifact 35</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏛️</text></svg>">
  <meta name="description" content="10x10x10 Spatial VR Studio Sandbox for Meta Quest 2. Features live dynamic wall canvas with real-time AI image generation, 50% scale model inserter table, and large reading slate.">

  <!-- A-Frame Core (local vendor with CDN fallback) -->
  <script src="./vendor/aframe.min.js"></script>
  <script src="./vendor/aframe-extras.min.js"></script>
  <script>
    if (typeof AFRAME === 'undefined') {
      document.write('<script src="https://aframe.io/releases/1.6.0/aframe.min.js"><\/script>');
      document.write('<script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.0/dist/aframe-extras.min.js"><\/script>');
    }
  </script>

  <!-- Supabase Realtime Client for Quest Microphone Audio & Text Relay -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #070913;
      --cyan: #00f5d4;
      --cyan-glow: rgba(0, 245, 212, 0.45);
      --amber: #f59e0b;
      --panel-bg: rgba(9, 13, 24, 0.92);
      --border-cyan: rgba(0, 245, 212, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: var(--bg-dark);
      color: #f8fafc;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* Top Overlay Navigation Header for Desktop / 2D Browser */
    .top-header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 54px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      background: linear-gradient(180deg, rgba(7, 9, 19, 0.96) 0%, rgba(7, 9, 19, 0.6) 80%, transparent 100%);
      border-bottom: 1px solid rgba(0, 245, 212, 0.2);
      z-index: 999;
      pointer-events: auto;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--cyan);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      background: rgba(0, 245, 212, 0.10);
      border: 1px solid var(--border-cyan);
      border-radius: 20px;
      transition: all 0.2s ease;
    }

    .btn-back:hover {
      background: rgba(0, 245, 212, 0.22);
      color: #fff;
      transform: translateY(-1px);
    }

    .header-title {
      font-family: 'Cinzel', serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-title span {
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      padding: 2px 8px;
      background: rgba(0, 245, 212, 0.15);
      border: 1px solid var(--border-cyan);
      border-radius: 12px;
      color: var(--cyan);
      font-weight: 500;
      letter-spacing: 0;
    }

    .telemetry-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(4, 7, 14, 0.85);
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid rgba(0, 245, 212, 0.25);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      color: #94a3b8;
    }

    .dot-live {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    /* Desktop Controls Guide Overlay */
    .controls-overlay {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(7, 11, 22, 0.88);
      border: 1px solid rgba(0, 245, 212, 0.25);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 12px;
      color: #cbd5e1;
      z-index: 999;
      pointer-events: none;
      backdrop-filter: blur(8px);
      max-width: 340px;
      line-height: 1.5;
    }

    .controls-overlay strong {
      color: var(--cyan);
      display: block;
      margin-bottom: 4px;
      font-size: 12.5px;
    }

    .controls-overlay kbd {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 4px;
      padding: 1px 5px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      color: #f8fafc;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="top-header">
    <div class="header-left">
      <a href="../#artifacts" class="btn-back">
        <span>←</span> Horizon Sanctuary
      </a>
      <div class="header-title">
        VR STUDIO SANDBOX <span>ARTIFACT 35</span>
      </div>
    </div>
    <div class="telemetry-pill">
      <span class="dot-live"></span>
      <span id="header-status">Studio Live • Large Terminal Slate</span>
    </div>
  </header>

  <!-- 2D Desktop Controls Overlay -->
  <div class="controls-overlay" id="desktop-controls">
    <strong>🎮 Controls Scheme</strong>
    • <b>Quest 2 VR</b>: Left Stick = Move | Right Stick = Astra Head Pivot Turn | Laser Trigger = Click Voice Button.<br>
    • <b>Desktop</b>: <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> = Walk | Drag Mouse = Look | Click Voice Button.
  </div>

  <!-- Master A-Frame WebXR Scene -->
  <a-scene
    renderer="antialias: true; colorManagement: true; foveationLevel: 1; sortObjects: true"
    vr-mode-ui="enabled: true"
    webxr="optionalFeatures: hit-test, local-floor"
    background="color: #030712">

    <!-- Asset Preloader -->
    <a-assets timeout="10000">
      <img id="img-canvas-default" src="./textures/studio_canvas_default.jpg" crossorigin="anonymous">
      <img id="img-canvas-dawn" src="./textures/canvas_cosmic_dawn.jpg" crossorigin="anonymous">
      <img id="img-canvas-hearth" src="./textures/canvas_living_hearth.jpg" crossorigin="anonymous">
      <img id="img-canvas-haven" src="./textures/canvas_haven_manor.jpg" crossorigin="anonymous">
      <img id="img-canvas-odyssey" src="./textures/canvas_odyssey_panorama.jpg" crossorigin="anonymous">
      <img id="img-canvas-blender" src="./textures/canvas_blender_forge.jpg" crossorigin="anonymous">
      
      <!-- Preloaded 3D Models for Inserter -->
      <a-asset-item id="model-monolith" src="./models/blender_nexus_monolith.glb"></a-asset-item>
      <a-asset-item id="model-hoverbot" src="./models/glimmer_hoverbot.glb"></a-asset-item>
      <a-asset-item id="model-plant" src="./models/conservatory_plant_pbr.glb"></a-asset-item>
      <a-asset-item id="model-tesla" src="./models/tesla_optimus_pbr.glb"></a-asset-item>
      <a-asset-item id="model-robot" src="./models/antigravity_robot.glb"></a-asset-item>
    </a-assets>

    <!-- ============================================================= -->
    <!-- PLAYER RIG: Quest 2 Head-Centric Pivot & Substep Locomotion   -->
    <!-- ============================================================= -->
    <a-entity id="player-rig" position="0 0 2.8" rotation="0 0 0">
      <!-- Head Camera -->
      <a-camera
        id="head-camera"
        position="0 1.65 0"
        look-controls="pointerLockEnabled: false"
        wasd-controls="enabled: false">
        <a-cursor
          id="camera-cursor"
          position="0 0 -1"
          geometry="primitive: ring; radiusInner: 0.007; radiusOuter: 0.012"
          material="color: #00f5d4; shader: flat; opacity: 0.75"
          raycaster="objects: .clickable; far: 4">
        </a-cursor>
      </a-camera>

      <!-- Left Quest Controller (Astra Sub-stepped Locomotion) -->
      <a-entity
        id="left-controller"
        oculus-touch-controls="hand: left"
        quest-smooth-locomotion="speed: 2.0; deadzone: 0.14"
        laser-controls="hand: left"
        raycaster="objects: .clickable; far: 5; showLine: true; lineColor: #00f5d4; lineOpacity: 0.5">
      </a-entity>

      <!-- Right Quest Controller (Astra Head-Centric Smooth Turn) -->
      <a-entity
        id="right-controller"
        oculus-touch-controls="hand: right"
        quest-smooth-turn="turnSpeed: 58.0; deadzone: 0.14"
        laser-controls="hand: right"
        raycaster="objects: .clickable; far: 5; showLine: true; lineColor: #38bdf8; lineOpacity: 0.6">
      </a-entity>
    </a-entity>

    <!-- Desktop Keyboard Navigation Component -->
    <a-entity desktop-keyboard-nav="speed: 2.4"></a-entity>

    <!-- ============================================================= -->
    <!-- LIGHTING ENVIRONMENT: Architectural Studio Atmosphere         -->
    <!-- ============================================================= -->
    <a-entity light="type: ambient; color: #1e293b; intensity: 0.85"></a-entity>
    <a-entity light="type: point; color: #f8fafc; intensity: 0.9; distance: 15; decay: 2" position="0 5.2 0"></a-entity>
    <a-entity light="type: spot; color: #fffbeb; intensity: 1.4; angle: 48; penumbra: 0.4; distance: 9" position="0 4.8 -2.2" rotation="-40 0 0"></a-entity>
    <a-entity light="type: spot; color: #38bdf8; intensity: 1.6; angle: 32; penumbra: 0.3; distance: 7" position="0 4.6 -1.8" rotation="-90 0 0"></a-entity>
    <a-entity light="type: point; color: #00f5d4; intensity: 0.4; distance: 6" position="-4.5 2.5 -4.5"></a-entity>
    <a-entity light="type: point; color: #f59e0b; intensity: 0.4; distance: 6" position="4.5 2.5 -4.5"></a-entity>
    <a-entity light="type: point; color: #3b82f6; intensity: 0.3; distance: 6" position="-4.5 2.5 4.5"></a-entity>
    <a-entity light="type: point; color: #10b981; intensity: 0.3; distance: 6" position="4.5 2.5 4.5"></a-entity>

    <!-- ============================================================= -->
    <!-- 10x10x10 ARCHITECTURAL STUDIO CUBE ROOM                       -->
    <!-- ============================================================= -->
    <a-entity id="studio-room">
      <!-- 1. Polished Studio Floor (10m x 10m at Y=0) -->
      <a-plane
        id="room-floor"
        position="0 0 0"
        rotation="-90 0 0"
        width="10"
        height="10"
        material="color: #0f172a; roughness: 0.25; metalness: 0.15">
      </a-plane>
      
      <!-- Perimeter Brass Floor Trim -->
      <a-box position="0 0.02 -4.95" width="10" height="0.04" depth="0.1" material="color: #b45309; metalness: 0.6; roughness: 0.3"></a-box>
      <a-box position="0 0.02 4.95" width="10" height="0.04" depth="0.1" material="color: #b45309; metalness: 0.6; roughness: 0.3"></a-box>
      <a-box position="-4.95 0.02 0" width="0.1" height="0.04" depth="10" material="color: #b45309; metalness: 0.6; roughness: 0.3"></a-box>
      <a-box position="4.95 0.02 0" width="0.1" height="0.04" depth="10" material="color: #b45309; metalness: 0.6; roughness: 0.3"></a-box>

      <!-- 2. Studio Ceiling (10m x 10m at Y=6.0m) -->
      <a-plane
        id="room-ceiling"
        position="0 6.0 0"
        rotation="90 0 0"
        width="10"
        height="10"
        material="color: #0b0f19; roughness: 0.9; metalness: 0.1">
      </a-plane>

      <!-- Ceiling Architectural Beams -->
      <a-box position="0 5.9 -2.5" width="10" height="0.2" depth="0.3" material="color: #1e293b; roughness: 0.7"></a-box>
      <a-box position="0 5.9 0" width="10" height="0.2" depth="0.3" material="color: #1e293b; roughness: 0.7"></a-box>
      <a-box position="0 5.9 2.5" width="10" height="0.2" depth="0.3" material="color: #1e293b; roughness: 0.7"></a-box>

      <!-- 3. North Gallery Wall (Z = -5.0m) -->
      <a-plane id="wall-north" position="0 3.0 -5.0" rotation="0 0 0" width="10" height="6" material="color: #111827; roughness: 0.85; metalness: 0.05"></a-plane>
      <a-plane id="wall-south" position="0 3.0 5.0" rotation="0 180 0" width="10" height="6" material="color: #111827; roughness: 0.85; metalness: 0.05"></a-plane>
      <a-plane id="wall-west" position="-5.0 3.0 0" rotation="0 90 0" width="10" height="6" material="color: #0d1322; roughness: 0.85; metalness: 0.05"></a-plane>
      <a-plane id="wall-east" position="5.0 3.0 0" rotation="0 -90 0" width="10" height="6" material="color: #0d1322; roughness: 0.85; metalness: 0.05"></a-plane>
    </a-entity>

    <!-- ============================================================= -->
    <!-- THE WALL CANVAS (North Wall: X=0, Y=2.5, Z=-4.92)              -->
    <!-- ============================================================= -->
    <a-entity id="gallery-canvas-assembly" position="0 2.55 -4.92">
      <a-box id="canvas-frame" position="0 0 -0.04" width="4.4" height="2.8" depth="0.08" material="color: #1c140d; roughness: 0.5; metalness: 0.2"></a-box>
      <a-box position="0 0 -0.01" width="4.26" height="2.66" depth="0.04" material="color: #d97706; roughness: 0.35; metalness: 0.7"></a-box>

      <!-- Dynamic Live Wall Canvas Plane (Receives AI Images in Real Time!) -->
      <a-plane
        id="studio-wall-canvas"
        class="clickable"
        position="0 0 0.015"
        width="4.2"
        height="2.6"
        material="src: #img-canvas-default; shader: standard; roughness: 0.25; metalness: 0.05">
      </a-plane>

      <a-entity id="canvas-plaque" position="0 -1.58 0.02">
        <a-plane width="2.6" height="0.22" material="color: #0f172a; roughness: 0.4; metalness: 0.6"></a-plane>
        <a-text
          id="canvas-plaque-title"
          value="Cosmic Dawn Sanctuary • Canvas Live"
          align="center"
          position="0 0 0.01"
          width="3.4"
          color="#fbbf24"
          font="kelsonsans">
        </a-text>
      </a-entity>
    </a-entity>

    <!-- ============================================================= -->
    <!-- THE MODEL INSERTER TABLE & PEDESTAL (Center: X=0, Z=-1.8)     -->
    <!-- ============================================================= -->
    <a-entity id="workbench-assembly" position="0 0 -1.8">
      <a-box id="tabletop" position="0 0.82 0" width="2.2" height="0.08" depth="1.2" material="color: #1e1b18; roughness: 0.4; metalness: 0.15"></a-box>
      <a-box position="0 0.825 0.59" width="2.2" height="0.07" depth="0.02" material="color: #d97706; metalness: 0.7; roughness: 0.3"></a-box>
      <a-box position="0 0.825 -0.59" width="2.2" height="0.07" depth="0.02" material="color: #d97706; metalness: 0.7; roughness: 0.3"></a-box>

      <a-cylinder position="-0.95 0.4 -0.48" radius="0.035" height="0.8" material="color: #0f172a; metalness: 0.8; roughness: 0.2"></a-cylinder>
      <a-cylinder position="0.95 0.4 -0.48" radius="0.035" height="0.8" material="color: #0f172a; metalness: 0.8; roughness: 0.2"></a-cylinder>
      <a-cylinder position="-0.95 0.4 0.48" radius="0.035" height="0.8" material="color: #0f172a; metalness: 0.8; roughness: 0.2"></a-cylinder>
      <a-cylinder position="0.95 0.4 0.48" radius="0.035" height="0.8" material="color: #0f172a; metalness: 0.8; roughness: 0.2"></a-cylinder>

      <!-- Raised Dais -->
      <a-cylinder id="pedestal-dais" class="clickable" position="0 0.89 0" radius="0.44" height="0.06" material="color: #090d16; metalness: 0.6; roughness: 0.2"></a-cylinder>
      <a-ring position="0 0.925 0" rotation="-90 0 0" radius-inner="0.38" radius-outer="0.42" material="color: #00f5d4; shader: flat; opacity: 0.85" animation="property: material.opacity; from: 0.4; to: 0.95; dir: alternate; loop: true; dur: 1800"></a-ring>

      <a-entity position="0 0.82 0.61">
        <a-plane width="0.9" height="0.06" material="color: #0f172a; metalness: 0.5"></a-plane>
        <a-text id="pedestal-label" value="MODEL INSERTER • NEXUS MONOLITH" align="center" position="0 0 0.01" width="1.3" color="#00f5d4" font="kelsonsans"></a-text>
      </a-entity>

      <!-- Dynamic 3D Model Slot (50% scale) -->
      <a-entity id="model-inserter-slot" position="0 0.95 0" rotation="0 0 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 28000; easing: linear">
        <a-entity id="active-model-entity" gltf-model="#model-monolith" scale="0.6 0.6 0.6" position="0 0 0"></a-entity>
      </a-entity>
    </a-entity>

    <!-- ============================================================= -->
    <!-- IN-VR CHAT TERMINAL STAND: EXPANDED LARGE SLATE               -->
    <!-- Positioned at X=-2.6, Z=-0.2, Y=1.45 (Angled 52° to center)   -->
    <!-- Width: 1.85m, Height: 1.35m — Fits substantive paragraphs!    -->
    <!-- ============================================================= -->
    <a-entity id="vr-terminal-rig" position="-2.6 0 -0.2" rotation="0 52 0">
      <!-- Twin Steel Stand Columns -->
      <a-cylinder position="-0.5 0.6 0" radius="0.03" height="1.2" material="color: #1e293b; metalness: 0.8; roughness: 0.2"></a-cylinder>
      <a-cylinder position="0.5 0.6 0" radius="0.03" height="1.2" material="color: #1e293b; metalness: 0.8; roughness: 0.2"></a-cylinder>
      <a-box position="0 0.02 0" width="1.4" height="0.04" depth="0.4" material="color: #0f172a; metalness: 0.8; roughness: 0.2"></a-box>

      <!-- Large Holographic Glass Panel Assembly -->
      <a-entity position="0 1.45 0" rotation="-10 0 0">
        <!-- Main Glass Board (1.85m Wide x 1.35m Tall) -->
        <a-plane
          width="1.85"
          height="1.35"
          material="color: #040711; opacity: 0.96; transparent: true; roughness: 0.2; metalness: 0.3"
          class="clickable">
        </a-plane>

        <!-- Luminous Cyan Accent Borders -->
        <a-box position="0 0.665 0.01" width="1.85" height="0.015" depth="0.02" material="color: #00f5d4; shader: flat; opacity: 0.7"></a-box>
        <a-box position="0 -0.665 0.01" width="1.85" height="0.015" depth="0.02" material="color: #00f5d4; shader: flat; opacity: 0.7"></a-box>
        <a-box position="-0.92 0 0.01" width="0.015" height="1.33" depth="0.02" material="color: #00f5d4; shader: flat; opacity: 0.7"></a-box>
        <a-box position="0.92 0 0.01" width="0.015" height="1.33" depth="0.02" material="color: #00f5d4; shader: flat; opacity: 0.7"></a-box>

        <!-- Top Header Banner -->
        <a-text
          value="HORIZON VR STUDIO • ANTIGRAVITY"
          align="center"
          position="0 0.58 0.02"
          width="2.2"
          color="#00f5d4"
          font="kelsonsans">
        </a-text>

        <!-- Status Indicator Pill -->
        <a-plane position="0 0.49 0.02" width="1.0" height="0.07" material="color: #032e2b; opacity: 0.95"></a-plane>
        <a-text
          id="hud-status-text"
          value="🟢 ONLINE • READY FOR VOICE COMMANDS"
          align="center"
          position="0 0.49 0.025"
          width="1.3"
          color="#34d399"
          font="kelsonsans">
        </a-text>

        <!-- SUBSTANTIAL DIALOGUE SLATE (1.68m x 0.72m) -->
        <a-plane position="0 0.07 0.02" width="1.68" height="0.70" material="color: #080e1a; opacity: 0.92"></a-plane>
        
        <!-- User Query Section (Top Half) -->
        <a-text
          value="CHRISTOPHER:"
          position="-0.78 0.35 0.025"
          width="1.3"
          color="#94a3b8"
          font="kelsonsans">
        </a-text>
        <a-text
          id="hud-user-query"
          value="Push the button below, speak naturally into your Quest 2 mic, and click again to send."
          position="-0.78 0.24 0.025"
          width="1.56"
          wrap-count="48"
          color="#f8fafc"
          font="kelsonsans">
        </a-text>

        <a-line start="-0.78 0.12 0.025" end="0.78 0.12 0.025" color="#1e293b"></a-line>

        <!-- Antigravity Response Section (Bottom Half — Multi-Paragraph Capacity!) -->
        <a-text
          value="ANTIGRAVITY:"
          position="-0.78 0.06 0.025"
          width="1.3"
          color="#38bdf8"
          font="kelsonsans">
        </a-text>
        <a-text
          id="hud-ai-reply"
          value="Standing by in the studio. You can ask me to paint anything on the wall canvas (e.g. 'generate a cat', 'paint a cosmic dawn'), or insert 3D models onto the center table."
          position="-0.78 -0.08 0.025"
          width="1.56"
          wrap-count="48"
          color="#38bdf8"
          font="kelsonsans">
        </a-text>

        <!-- ========================================================= -->
        <!-- PUSH-TO-TALK BUTTON (Extra-Large Tactile Target)         -->
        <!-- ========================================================= -->
        <a-entity id="hud-mic-button-group" position="0 -0.46 0.03">
          <a-plane
            id="hud-mic-btn"
            class="clickable"
            width="1.45"
            height="0.18"
            material="color: #0284c7; roughness: 0.3; metalness: 0.3">
          </a-plane>
          <a-text
            id="hud-mic-label"
            value="🎙️ CLICK TO SPEAK (RECORD VOICE)"
            align="center"
            position="0 0 0.01"
            width="1.65"
            color="#ffffff"
            font="kelsonsans">
          </a-text>
        </a-entity>

      </a-entity>
    </a-entity>

  </a-scene>

  <!-- ============================================================= -->
  <!-- APPLICATION RUNTIME LOGIC: Locomotion, Live Canvas & Inserter -->
  <!-- ============================================================= -->
  <script>
    function axisCurve(raw, deadzone) {
      if (Math.abs(raw) < deadzone) return 0;
      const sign = Math.sign(raw);
      const scaled = (Math.abs(raw) - deadzone) / (1 - deadzone);
      return sign * Math.pow(scaled, 1.8);
    }

    function checkWallCollision(x, z) {
      if (x < -4.6 || x > 4.6 || z < -4.6 || z > 4.6) return true;
      if (x > -1.2 && x < 1.2 && z > -2.5 && z < -1.1) return true;
      if (x > -3.0 && x < -2.1 && z > -0.6 && z < 0.3) return true;
      return false;
    }

    function moveWithSlide(currentPos, dx, dz) {
      let targetX = currentPos.x + dx;
      let targetZ = currentPos.z + dz;

      if (!checkWallCollision(targetX, targetZ)) return { x: targetX, z: targetZ };
      if (!checkWallCollision(targetX, currentPos.z)) return { x: targetX, z: currentPos.z };
      if (!checkWallCollision(currentPos.x, targetZ)) return { x: currentPos.x, z: targetZ };
      return { x: currentPos.x, z: currentPos.z };
    }

    // -------------------------------------------------------------
    // Quest 2 Locomotion & Turn Components
    // -------------------------------------------------------------
    AFRAME.registerComponent('quest-smooth-locomotion', {
      schema: { speed: { type: 'number', default: 2.0 }, deadzone: { type: 'number', default: 0.14 } },
      init: function() {
        this.axisX = 0;
        this.axisY = 0;
        this.rigEl = this.el.sceneEl.querySelector('#player-rig');
        this.cameraEl = this.el.sceneEl.querySelector('#head-camera');

        this.el.addEventListener('axismove', (evt) => {
          const axes = evt.detail.axis;
          if (axes && axes.length >= 2) {
            let rawX = axes.length > 2 ? axes[2] : axes[0];
            let rawY = axes.length > 3 ? axes[3] : axes[1];
            this.axisX = axisCurve(rawX, this.data.deadzone);
            this.axisY = axisCurve(rawY, this.data.deadzone);
          }
        });
      },
      tick: function(time, delta) {
        if (!this.rigEl || !this.cameraEl) return;
        if (this.axisX === 0 && this.axisY === 0) return;

        const dt = Math.min(delta / 1000.0, 0.05);
        const currentPos = this.rigEl.object3D.position;

        const camRot = this.cameraEl.getAttribute('rotation');
        const yaw = THREE.MathUtils.degToRad(camRot.y);

        const fwdX = -Math.sin(yaw);
        const fwdZ = -Math.cos(yaw);
        const rightX = Math.cos(yaw);
        const rightZ = -Math.sin(yaw);

        const moveDist = this.data.speed * dt;
        let dx = (fwdX * -this.axisY + rightX * this.axisX) * moveDist;
        let dz = (fwdZ * -this.axisY + rightZ * this.axisX) * moveDist;

        const bounded = moveWithSlide(currentPos, dx, dz);
        currentPos.x = bounded.x;
        currentPos.z = bounded.z;
      }
    });

    AFRAME.registerComponent('quest-smooth-turn', {
      schema: { turnSpeed: { type: 'number', default: 58.0 }, deadzone: { type: 'number', default: 0.14 } },
      init: function() {
        this.turnAxis = 0;
        this.rigEl = this.el.sceneEl.querySelector('#player-rig');
        this.cameraEl = this.el.sceneEl.querySelector('#head-camera');

        this.el.addEventListener('axismove', (evt) => {
          const axes = evt.detail.axis;
          if (axes && axes.length >= 2) {
            let rawX = axes.length > 2 ? axes[2] : axes[0];
            this.turnAxis = axisCurve(rawX, this.data.deadzone);
          }
        });
      },
      tick: function(time, delta) {
        if (!this.rigEl || this.turnAxis === 0) return;
        const dt = Math.min(delta / 1000.0, 0.05);
        const dYaw = -this.turnAxis * this.data.turnSpeed * dt;
        const rad = THREE.MathUtils.degToRad(dYaw);

        if (this.cameraEl) {
          const headWorld = new THREE.Vector3();
          this.cameraEl.object3D.getWorldPosition(headWorld);

          this.rigEl.object3D.rotation.y += rad;
          this.rigEl.object3D.updateMatrixWorld(true);

          const newHeadWorld = new THREE.Vector3();
          this.cameraEl.object3D.getWorldPosition(newHeadWorld);

          this.rigEl.object3D.position.x += headWorld.x - newHeadWorld.x;
          this.rigEl.object3D.position.z += headWorld.z - newHeadWorld.z;
        } else {
          this.rigEl.object3D.rotation.y += rad;
        }
      }
    });

    AFRAME.registerComponent('desktop-keyboard-nav', {
      schema: { speed: { type: 'number', default: 2.4 } },
      init: function() {
        this.keys = {};
        this.rigEl = document.querySelector('#player-rig');
        this.cameraEl = document.querySelector('#head-camera');

        window.addEventListener('keydown', (e) => { this.keys[e.code] = true; });
        window.addEventListener('keyup', (e) => { this.keys[e.code] = false; });
      },
      tick: function(time, delta) {
        if (!this.rigEl || !this.cameraEl) return;
        let fwd = 0, right = 0;
        if (this.keys['KeyW'] || this.keys['ArrowUp']) fwd += 1;
        if (this.keys['KeyS'] || this.keys['ArrowDown']) fwd -= 1;
        if (this.keys['KeyA'] || this.keys['ArrowLeft']) right -= 1;
        if (this.keys['KeyD'] || this.keys['ArrowRight']) right += 1;

        if (fwd === 0 && right === 0) return;

        const dt = Math.min(delta / 1000.0, 0.05);
        const camRot = this.cameraEl.getAttribute('rotation');
        const yaw = THREE.MathUtils.degToRad(camRot.y);

        const fwdX = -Math.sin(yaw);
        const fwdZ = -Math.cos(yaw);
        const rightX = Math.cos(yaw);
        const rightZ = -Math.sin(yaw);

        const moveDist = this.data.speed * dt;
        let dx = (fwdX * fwd + rightX * right) * moveDist;
        let dz = (fwdZ * fwd + rightZ * right) * moveDist;

        const currentPos = this.rigEl.object3D.position;
        const bounded = moveWithSlide(currentPos, dx, dz);
        currentPos.x = bounded.x;
        currentPos.z = bounded.z;
      }
    });

    // =============================================================
    // DYNAMIC STUDIO CONTROLLER: Large Slate, AI Art & 3D Inserter
    // =============================================================
    class StudioManager {
      constructor() {
        this.wallCanvasEl = document.querySelector('#studio-wall-canvas');
        this.canvasPlaqueTitle = document.querySelector('#canvas-plaque-title');
        this.modelSlotEl = document.querySelector('#model-inserter-slot');
        this.pedestalLabel = document.querySelector('#pedestal-label');
        
        // In-VR HUD elements (Large Slate)
        this.hudStatus = document.querySelector('#hud-status-text');
        this.hudUserQuery = document.querySelector('#hud-user-query');
        this.hudAiReply = document.querySelector('#hud-ai-reply');
        this.micBtn = document.querySelector('#hud-mic-btn');
        this.micLabel = document.querySelector('#hud-mic-label');

        this.isRecording = false;
        this.mediaRecorder = null;
        this.audioChunks = [];
        this.micStream = null;
        this.loader = new THREE.TextureLoader();

        // Initialize Supabase Realtime Relay
        this.initSupabaseRelay();

        // Initialize Audio Recording
        this.initVoiceButton();
      }

      initSupabaseRelay() {
        try {
          if (typeof supabase !== 'undefined') {
            const SUPABASE_URL = 'https://gbyuturnmvfojtpgurun.supabase.co';
            const SUPABASE_KEY = 'sb_publishable_unRzEUh5rkdVI2DdIFqh5g_6K-JMEGi';
            this.sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            this.sbChannel = this.sbClient.channel('haven_manor_hearth');

            this.sbChannel.on('broadcast', { event: 'avatar_response' }, ({ payload }) => {
              console.log('⚡ Received AI response from relay:', payload);
              this.handleServerResponse(payload);
            });

            this.sbChannel.subscribe((status) => {
              console.log('Supabase Realtime status:', status);
              if (status === 'SUBSCRIBED') {
                this.setStatus('🟢 ONLINE • READY FOR VOICE COMMANDS');
              }
            });
          }
        } catch (err) {
          console.warn('Supabase Realtime setup warning:', err);
        }
      }

      // -----------------------------------------------------------
      // 1. Live Dynamic Canvas Update (With AI Generation Fallback!)
      // -----------------------------------------------------------
      updateCanvas(textureUrl, titleText) {
        if (!this.wallCanvasEl) return;
        this.setStatus(`🎨 Synthesizing Wall Canvas: ${titleText}...`);

        if (this.canvasPlaqueTitle) {
          this.canvasPlaqueTitle.setAttribute('value', `${titleText} • Canvas Live`);
        }

        this.loader.load(textureUrl, (texture) => {
          const mesh = this.wallCanvasEl.getObject3D('mesh');
          if (mesh && mesh.material) {
            texture.colorSpace = THREE.SRGBColorSpace;
            mesh.material.map = texture;
            mesh.material.needsUpdate = true;
          }
          this.setStatus('🟢 ONLINE • CANVAS UPDATED');
        }, undefined, (err) => {
          console.warn('Canvas texture load error, generating live AI fallback:', err);
          // If local URL 404s (e.g. cat request), generate dynamic image via live AI synthesis API!
          const aiGenUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(titleText)}?width=1280&height=768&nologo=true`;
          this.loader.load(aiGenUrl, (genTex) => {
            const mesh = this.wallCanvasEl.getObject3D('mesh');
            if (mesh && mesh.material) {
              genTex.colorSpace = THREE.SRGBColorSpace;
              mesh.material.map = genTex;
              mesh.material.needsUpdate = true;
            }
            this.setStatus('🟢 ONLINE • FRESH AI IMAGE GENERATED');
          });
        });
      }

      // -----------------------------------------------------------
      // 2. Live Dynamic Model Inserter (Loads .glb at 50% scale!)
      // -----------------------------------------------------------
      insertModel(modelPath, modelTitle, scaleFactor = 0.5) {
        if (!this.modelSlotEl) return;
        this.setStatus(`🗿 Loading 3D Model: ${modelTitle}...`);

        if (this.pedestalLabel) {
          this.pedestalLabel.setAttribute('value', `MODEL INSERTER • ${modelTitle.toUpperCase()}`);
        }

        while (this.modelSlotEl.firstChild) {
          this.modelSlotEl.removeChild(this.modelSlotEl.firstChild);
        }

        if (!modelPath || modelPath === 'clear') {
          this.pedestalLabel.setAttribute('value', 'MODEL INSERTER • EMPTY PEDESTAL');
          this.setStatus('🟢 ONLINE • PEDESTAL CLEARED');
          return;
        }

        const newEntity = document.createElement('a-entity');
        newEntity.setAttribute('gltf-model', modelPath);
        newEntity.setAttribute('scale', `${scaleFactor} ${scaleFactor} ${scaleFactor}`);
        newEntity.setAttribute('position', '0 0 0');
        
        newEntity.setAttribute('animation__scale', {
          property: 'scale',
          from: '0.01 0.01 0.01',
          to: `${scaleFactor} ${scaleFactor} ${scaleFactor}`,
          dur: 800,
          easing: 'easeOutBack'
        });

        this.modelSlotEl.appendChild(newEntity);
        setTimeout(() => {
          this.setStatus('🟢 ONLINE • MODEL INSTANTIATED');
        }, 800);
      }

      setStatus(text) {
        if (this.hudStatus) this.hudStatus.setAttribute('value', text);
      }

      setDialogue(userText, aiText) {
        if (this.hudUserQuery) this.hudUserQuery.setAttribute('value', userText);
        if (this.hudAiReply) this.hudAiReply.setAttribute('value', aiText);
      }

      // -----------------------------------------------------------
      // 3. Microphone Push-to-Talk via MediaRecorder (Quest 2 Native)
      // -----------------------------------------------------------
      initVoiceButton() {
        if (!this.micBtn) return;

        this.micBtn.addEventListener('click', async () => {
          if (!this.isRecording) {
            await this.startRecording();
          } else {
            this.stopRecording();
          }
        });
      }

      async startRecording() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          this.setDialogue("Microphone error", "Microphone access is not supported or blocked in this browser.");
          return;
        }

        try {
          this.micStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              channelCount: 1,
              sampleRate: 16000,
              echoCancellation: true,
              noiseSuppression: true
            }
          });

          this.audioChunks = [];
          const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
            ? 'audio/webm;codecs=opus'
            : (MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4');

          this.mediaRecorder = new MediaRecorder(this.micStream, { mimeType: mime });

          this.mediaRecorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) this.audioChunks.push(e.data);
          };

          this.mediaRecorder.onstop = () => {
            if (this.micStream) {
              this.micStream.getTracks().forEach(t => t.stop());
              this.micStream = null;
            }
            const audioBlob = new Blob(this.audioChunks, { type: mime });
            this.sendAudioPayload(audioBlob, mime);
          };

          this.mediaRecorder.start();
          this.isRecording = true;
          this.micBtn.setAttribute('material', 'color', '#dc2626'); // Red
          this.micLabel.setAttribute('value', '🔴 LISTENING... (CLICK TO SEND)');
          this.setStatus('🎙️ RECORDING FROM QUEST MIC... SPEAK NOW');

        } catch (err) {
          console.warn('Mic permission error:', err);
          this.setDialogue("Permission Denied", "Microphone access blocked. Please allow mic permissions in Quest Browser settings.");
          this.resetMicUI();
        }
      }

      stopRecording() {
        if (this.mediaRecorder && this.isRecording) {
          this.isRecording = false;
          this.mediaRecorder.stop();
          this.micBtn.setAttribute('material', 'color', '#d97706'); // Amber
          this.micLabel.setAttribute('value', '⏳ SENDING TO ANTIGRAVITY...');
          this.setStatus('⏳ TRANSMITTING AUDIO TO AI RELAY...');
        }
      }

      resetMicUI() {
        this.isRecording = false;
        if (this.micBtn) this.micBtn.setAttribute('material', 'color', '#0284c7'); // Blue
        if (this.micLabel) this.micLabel.setAttribute('value', '🎙️ CLICK TO SPEAK (RECORD VOICE)');
        this.setStatus('🟢 ONLINE • READY FOR VOICE COMMANDS');
      }

      sendAudioPayload(blob, mimeType) {
        const reader = new FileReader();
        reader.onloadend = async () => {
          const base64Data = (reader.result || '').split(',')[1];
          if (!base64Data) {
            this.resetMicUI();
            return;
          }

          const queryId = 'vr_' + Date.now();
          console.log(`📡 Sending audio (${base64Data.length} chars) to AI Relay...`);

          this.pendingTimeout = setTimeout(() => {
            this.setDialogue("[Audio Sent]", "AI Relay took longer than 25s. The studio remains ready for your next thought.");
            this.resetMicUI();
          }, 25000);

          if (this.sbChannel) {
            await this.sbChannel.send({
              type: 'broadcast',
              event: 'avatar_query',
              payload: {
                queryId: queryId,
                audioBase64: base64Data,
                mimeType: mimeType,
                room: 'VR Studio Sandbox',
                timestamp: Date.now()
              }
            });
          }
        };
        reader.readAsDataURL(blob);
      }

      // -----------------------------------------------------------
      // 5. Handle AI Response (Parse Actions & Render Clean Text)
      // -----------------------------------------------------------
      handleServerResponse(payload) {
        if (this.pendingTimeout) {
          clearTimeout(this.pendingTimeout);
          this.pendingTimeout = null;
        }

        const rawText = payload?.text || "I heard you, Christopher.";
        const promptText = payload?.prompt || "[Spoken Audio Query]";

        // Parse any action tags: [ACTION: canvas, url: "...", title: "..."]
        const canvasMatch = rawText.match(/\[ACTION:\s*canvas,\s*url:\s*["']([^"']+)["'],\s*title:\s*["']([^"']+)["']\]/i);
        if (canvasMatch) {
          let cUrl = canvasMatch[1];
          let cTitle = canvasMatch[2];

          // If the AI requested a generic or freshly generated prompt (e.g. cat, dragon, etc.),
          // synthesize it live using the AI image generation pipeline!
          if (cUrl.includes('generated_') || !cUrl.startsWith('./textures/canvas_')) {
            cUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(cTitle)}?width=1280&height=768&nologo=true`;
          }
          this.updateCanvas(cUrl, cTitle);
        }

        // Parse any model action tags: [ACTION: model, url: "...", name: "..."]
        const modelMatch = rawText.match(/\[ACTION:\s*model,\s*url:\s*["']([^"']+)["'],\s*name:\s*["']([^"']+)["']\]/i);
        if (modelMatch) {
          const modelUrl = modelMatch[1];
          const modelName = modelMatch[2];
          let scale = 0.5;
          if (modelUrl.includes('robot')) scale = 0.45;
          if (modelUrl.includes('monolith')) scale = 0.6;
          if (modelUrl.includes('hoverbot')) scale = 0.55;
          if (modelUrl.includes('tesla')) scale = 0.42;
          this.insertModel(modelUrl, modelName, scale);
        }

        // Strip out action tags for clean textual display
        const cleanReply = rawText.replace(/\[ACTION:[^\]]+\]/gi, '').trim();

        this.setDialogue(promptText, cleanReply);
        this.resetMicUI();
      }
    }

    // Initialize when A-Frame scene is loaded
    window.addEventListener('DOMContentLoaded', () => {
      const scene = document.querySelector('a-scene');
      if (scene.hasLoaded) {
        window.studioMgr = new StudioManager();
      } else {
        scene.addEventListener('loaded', () => {
          window.studioMgr = new StudioManager();
        });
      }
    });
  </script>
