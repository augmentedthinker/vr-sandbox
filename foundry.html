<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=https://augmentedthinker.github.io/astra-spatial-foundry/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal to Astra Spatial Foundry</title>
  <style>
    body {
      background: #081416;
      color: #e9efdf;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card {
      background: rgba(14, 38, 41, 0.85);
      border: 1px solid rgba(103, 149, 135, 0.4);
      padding: 32px;
      border-radius: 12px;
      max-width: 480px;
    }
    h1 {
      font-size: 24px;
      color: #90f4d8;
      margin-bottom: 12px;
    }
    p {
      color: #a7c7bd;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    a.btn {
      display: inline-block;
      background: #d5e9d5;
      color: #102123;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      padding: 14px 28px;
      border-radius: 8px;
      transition: filter 0.2s;
    }
    a.btn:hover {
      filter: brightness(1.1);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>✳ Astra Spatial Foundry</h1>
    <p>Navigating to Christopher & Astra's WebXR Spatial Foundry...</p>
    <a class="btn" href="https://augmentedthinker.github.io/astra-spatial-foundry/">Enter Spatial Foundry ↗</a>
  </div>
</body>
</html>
